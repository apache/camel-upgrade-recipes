## https://github.com/apache/camel/blob/camel-4.22.1/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_22.adoc#camel-openai-1
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel422_1.migrateOpenAIFullResponseProperty
displayName: Migrate camel-openai CamelOpenAIResponse property (CAMEL-24539)
description: Renames the CamelOpenAIResponse exchange property to its operation-specific replacement in routes with a single embeddings, audio-transcription or audio-translation openai operation, only if the camel-openai dependency is present.
preconditions:
