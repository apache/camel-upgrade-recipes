#####
# Rules coming from https://camel.apache.org/manual/camel-4x-upgrade-guide-4_18.html
# Specifically changes introduced in 4.18.4 (upgrading from 4.18.3 to 4.18.4)
#
# The atmosphere-websocket header rename also ships in Camel 4.22.0, so per RECIPE-CONVENTIONS.md the
# recipe lives here and org.apache.camel.upgrade.camel422.CamelMigrationRecipe references it.
#####

#####
# Update the Camel project from 4.18.3 to 4.18.4
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel418_4.CamelMigrationRecipe
displayName: Migrates `camel 4.18.3` application to `camel 4.18.4`
description: Migrates `camel 4.18.3` application to `camel 4.18.4`.
recipeList:
  - org.apache.camel.upgrade.camel418_4.migrateAtmosphereWebsocketHeaders
---
## https://github.com/apache/camel/blob/camel-4.18.4/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_18.adoc#camel-atmosphere-websocket---potential-breaking-change
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel418_4.migrateAtmosphereWebsocketHeaders
displayName: Migrate camel-atmosphere-websocket header values to new naming convention
description: >-
  Renames the atmosphere-websocket Exchange header string values from websocket.* to CamelAtmosphereWebsocket*,
  a change that shipped in Camel 4.18.4 and 4.22.0, only when the camel-atmosphere-websocket dependency is
  present. Symbolic WebsocketConstants references are unaffected and need no migration.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-atmosphere-websocket
recipeList:
  - org.apache.camel.upgrade.camel418_3.RenameHeaders:
      headerMappings:
        websocket.connectionKey.list: CamelAtmosphereWebsocketConnectionKeyList
        websocket.connectionKey: CamelAtmosphereWebsocketConnectionKey
        websocket.sendToAll: CamelAtmosphereWebsocketSendToAll
        websocket.eventType: CamelAtmosphereWebsocketEventType
        websocket.errorType: CamelAtmosphereWebsocketErrorType
