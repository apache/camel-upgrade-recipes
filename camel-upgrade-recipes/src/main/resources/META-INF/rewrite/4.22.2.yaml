#####
# Rules coming from https://camel.apache.org/manual/camel-4x-upgrade-guide-4_22.html
# Specifically changes introduced in 4.22.2 (upgrading from 4.22.1 to 4.22.2)
#
# This patch recipe is referenced from org.apache.camel.upgrade.camel423.CamelMigrationRecipe,
# the next main-version recipe, per RECIPE-CONVENTIONS.md. The 4.22 LTS aggregate is tracked
# separately (https://github.com/apache/camel-upgrade-recipes/issues/129); until it exists, a
# 4.22.1 to 4.22.2 patch upgrade is run directly with
# -Drewrite.activeRecipes=org.apache.camel.upgrade.camel422_2.CamelMigrationRecipe.
#####

#####
# Update the Camel project from 4.22.1 to 4.22.2
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel422_2.CamelMigrationRecipe
displayName: Migrates `camel 4.22.1` application to `camel 4.22.2`
description: Migrates `camel 4.22.1` application to `camel 4.22.2`.
recipeList:
  ## inherited from patch recipe: the same header renames ship in 4.18.5
  - org.apache.camel.upgrade.camel418_5.migrateMustacheHeaders
  - org.apache.camel.upgrade.camel418_5.migrateChunkHeaders
  - org.apache.camel.upgrade.camel422_2.migratePqcParameterSpecs
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_22.adoc#camel-pqc---bouncy-castle-186-breaking-change
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel422_2.migratePqcParameterSpecs
displayName: Migrate the removed Bouncy Castle BCPQC parameter spec classes used with camel-pqc
description: >-
  Camel 4.22.2 and 4.23.0 moved to Bouncy Castle 1.86, which removed the legacy org.bouncycastle.pqc.jcajce.spec
  parameter spec classes. Changes them to the org.bouncycastle.jcajce.spec classes of the BC provider:
  CMCEParameterSpec, FrodoParameterSpec to FrodoKEMParameterSpec, KyberParameterSpec to MLKEMParameterSpec,
  DilithiumParameterSpec to MLDSAParameterSpec and SPHINCSPlusParameterSpec to SLHDSAParameterSpec. The static
  parameter-set fields of the new classes carry the standardized names (for example MLKEMParameterSpec.ml_kem_768
  instead of KyberParameterSpec.kyber768), so field references still need a manual fix-up. PicnicParameterSpec,
  PQCSignatureAlgorithms.PICNIC and PQCDefaultPicnicMaterial have no replacement.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-pqc
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.CMCEParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.CMCEParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.FrodoParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.FrodoKEMParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.KyberParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.MLKEMParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.DilithiumParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.MLDSAParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.SPHINCSPlusParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.SLHDSAParameterSpec
