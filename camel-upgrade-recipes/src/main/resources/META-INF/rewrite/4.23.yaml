## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-zeebe
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateZeebeToCamunda
displayName: Migrate camel-zeebe to camel-camunda
description: >-
  camel-zeebe, deprecated since 4.19 in favour of camel-camunda (which has shipped since 4.19 with the same 9
  operations), was removed in Camel 4.23. Migrates the dependency, the zeebe: URI scheme (including the jobKey to
  jobType endpoint option rename), the shared model classes, the 8 CamelZeebe* literal header names, the
  ZeebeConstants type and the camel.component.zeebe.* configuration keys that camel-camunda shares. All steps are bundled in a single
  dependency-gated recipe so that later steps still see the camel-zeebe dependency after earlier steps have
  renamed it. Header names are migrated with explicit old-to-new mappings rather than a prefix rename, since
  RenameHeaderPrefixes only matches the org.apache.camel.Message setHeader/getHeader methods and not the fluent
  ProcessorDefinition.setHeader(...) route-builder DSL, unlike RenameHeaders which handles both.
  gatewayHost/gatewayPort (replaced by grpcAddress, a single URL), ZeebeConstants.DEFAULT_GATEWAY_HOST/PORT (no
  CamundaConstants counterpart), the new SaaS/REST options, the two zeebe-only model classes
  (renamed rather than dropped: AbstractZeebeResponse to AbstractCamundaResponse and ZeebeMessage to
  CamundaMessage, both handled below), worker auto-complete behaviour and the zeebe() Endpoint DSL builder are not
  covered and need manual review.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-zeebe
recipeList:
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^zeebe:(.*?)jobKey=(.*)$"
      replacement: "zeebe:${1}jobType=${2}"
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^zeebe:(.*)$"
      replacement: "camunda:${1}"
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: org.apache.camel
      oldArtifactId: camel-zeebe
      newGroupId: org.apache.camel
      newArtifactId: camel-camunda
      newVersion: 4.23.0
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.client-id
      newPropertyKey: camel.component.camunda.client-id
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.client-secret
      newPropertyKey: camel.component.camunda.client-secret
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.o-auth-api
      newPropertyKey: camel.component.camunda.o-auth-api
  # the generated Spring Boot metadata spells the oAuthAPI key as o-auth-a-p-i, which relaxed binding does not
  # fold onto o-auth-api, so both spellings are migrated
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.o-auth-a-p-i
      newPropertyKey: camel.component.camunda.o-auth-a-p-i
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.bridge-error-handler
      newPropertyKey: camel.component.camunda.bridge-error-handler
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.lazy-start-producer
      newPropertyKey: camel.component.camunda.lazy-start-producer
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.autowired-enabled
      newPropertyKey: camel.component.camunda.autowired-enabled
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.zeebe.enabled
      newPropertyKey: camel.component.camunda.enabled
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.ZeebeConstants
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.CamundaConstants
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.AbstractZeebeResponse
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.AbstractCamundaResponse
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.ZeebeMessage
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.CamundaMessage
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.DeploymentRequest
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.DeploymentRequest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.DeploymentResponse
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.DeploymentResponse
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.JobRequest
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.JobRequest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.JobResponse
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.JobResponse
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.JobWorkerMessage
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.JobWorkerMessage
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.MessageRequest
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.MessageRequest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.MessageResponse
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.MessageResponse
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.ProcessDeploymentResponse
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.ProcessDeploymentResponse
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.ProcessRequest
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.ProcessRequest
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.component.zeebe.model.ProcessResponse
      newFullyQualifiedTypeName: org.apache.camel.component.camunda.model.ProcessResponse
  - org.apache.camel.upgrade.camel418_3.RenameHeaders:
      headerMappings:
        CamelZeebeResourceName: CamelCamundaResourceName
        CamelZeebeIsSuccess: CamelCamundaIsSuccess
        CamelZeebeErrorMessage: CamelCamundaErrorMessage
        CamelZeebeErrorCode: CamelCamundaErrorCode
        CamelZeebeBPMNProcessId: CamelCamundaBPMNProcessId
        CamelZeebeVersion: CamelCamundaVersion
        CamelZeebeProcessDefinitionKey: CamelCamundaProcessDefinitionKey
        CamelZeebeJobKey: CamelCamundaJobKey
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-langchain4j-tools
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.removeLangchain4jToolsModule
displayName: Remove camel-langchain4j-tools dependency
description: >-
  camel-langchain4j-tools was removed in Camel 4.23. Removes the dependency only once camel-ai-tool is present, so
  that this recipe running ahead of camel422.migrateLangchain4jToolsUris in the latest migration chain does not
  defeat that recipe's own camel-langchain4j-tools precondition before it has migrated the consumer endpoint URIs;
  the removal then takes effect on the following cycle. Producer endpoints for direct tool calling still need
  manual migration to langchain4j-agent.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-ai-tool
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-langchain4j-tools
---
