## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#components-and-language-removal
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateRemovedLanguageUris
displayName: Migrate language component URIs of the removed csimple and joor languages
description: >-
  Renames the csimple and joor language names in language: component URIs, following the removal of both
  languages in Camel 4.23. The replacement languages, simple and java, accept the same expression in the URI.
recipeList:
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^language:csimple:(.*)$"
      replacement: "language:simple:${1}"
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^language:joor:(.*)$"
      replacement: "language:java:${1}"
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-mustache-camel-chunk-potential-breaking-change
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateMustacheHeaders
displayName: Migrate camel-mustache header names to the Camel namespace
description: >-
  The MustacheConstants header values were moved into the Camel namespace in 4.23
  (MustacheResourceUri to CamelMustacheResourceUri, MustacheTemplate to CamelMustacheTemplate). Only literal
  header names need migrating; the constant names themselves are unchanged, so MustacheConstants usages are
  unaffected.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-mustache
recipeList:
  - org.apache.camel.upgrade.camel418_3.RenameHeaders:
      headerMappings:
        MustacheResourceUri: CamelMustacheResourceUri
        MustacheTemplate: CamelMustacheTemplate
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-mustache-camel-chunk-potential-breaking-change
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateChunkHeaders
displayName: Migrate camel-chunk header names to the Camel namespace
description: >-
  The ChunkConstants header values were moved into the Camel namespace in 4.23 (ChunkResourceUri to
  CamelChunkResourceUri, ChunkTemplate to CamelChunkTemplate). Only literal header names need migrating; the
  constant names themselves are unchanged, so ChunkConstants usages are unaffected.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-chunk
recipeList:
  - org.apache.camel.upgrade.camel418_3.RenameHeaders:
      headerMappings:
        ChunkResourceUri: CamelChunkResourceUri
        ChunkTemplate: CamelChunkTemplate
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-debezium-oracle-the-databaseoutservername-option-is-removed
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateDebeziumOracleOutServerName
displayName: Migrate camel-debezium-oracle databaseOutServerName to xstreamOutServerName
description: >-
  The databaseOutServerName option of camel-debezium-oracle was removed in 4.23; xstreamOutServerName, which
  already existed in 4.22 and configures the same setting, is now the only name. Migrates the endpoint URI
  option, the camel.component.debezium-oracle configuration key (kebab-case and camelCase, through relaxed
  binding) and the configuration class getter and setter.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-debezium-oracle
recipeList:
  - org.apache.camel.upgrade.customRecipes.ChangeComponentUriRecipe:
      uriPattern: "^debezium-oracle:(.*?)databaseOutServerName=(.*)$"
      replacement: "debezium-oracle:${1}xstreamOutServerName=${2}"
  - org.apache.camel.upgrade.customRecipes.PropertiesAndYamlKeyUpdate:
      oldPropertyKey: camel.component.debezium-oracle.database-out-server-name
      newPropertyKey: camel.component.debezium-oracle.xstream-out-server-name
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.component.debezium.oracle.configuration.OracleConnectorEmbeddedDebeziumConfiguration setDatabaseOutServerName(String)
      newMethodName: setXstreamOutServerName
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.component.debezium.oracle.configuration.OracleConnectorEmbeddedDebeziumConfiguration getDatabaseOutServerName()
      newMethodName: getXstreamOutServerName
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-jolt-switch-from-unmaintained-bazaarvoice-jolt-to-the-jolt-community-fork
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateJoltCommunityFork
displayName: Migrate camel-jolt from the bazaarvoice jolt library to the jolt-community fork
description: >-
  camel-jolt switched from the unmaintained com.bazaarvoice.jolt library to the io.github.jolt-community.jolt
  fork in 4.23. Renames the two Maven coordinates and the com.bazaarvoice.jolt package including its
  subpackages, which all exist unchanged in the fork (chainr, defaultr, exception, modifier, shiftr, traversr,
  utils and so on). Removr is the one class that moved, into a removr subpackage, so it is migrated with an
  explicit ChangeType ahead of the package rename.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-jolt
recipeList:
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: com.bazaarvoice.jolt
      oldArtifactId: jolt-core
      newGroupId: io.github.jolt-community.jolt
      newArtifactId: jolt-community-core
      # Applied to explicitly pinned versions only; BOM-managed dependencies keep their managed version
      newVersion: 1.3.0
  - org.openrewrite.maven.ChangeDependencyGroupIdAndArtifactId:
      oldGroupId: com.bazaarvoice.jolt
      oldArtifactId: json-utils
      newGroupId: io.github.jolt-community.jolt
      newArtifactId: json-community-utils
      newVersion: 1.3.0
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.bazaarvoice.jolt.Removr
      newFullyQualifiedTypeName: io.joltcommunity.jolt.removr.Removr
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.bazaarvoice.jolt
      newPackageName: io.joltcommunity.jolt
      recursive: true
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#components-and-language-removal
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.removedComponents
displayName: Remove the dependencies of components removed in Camel 4.23 without a replacement
description: >-
  camel-digitalocean, camel-iec60870, camel-irc, camel-ironmq, camel-json-patch, camel-leveldb, camel-splunk and
  camel-catalog-lucene were removed in Camel 4.23 without a drop-in replacement, so their dependencies are removed
  as in earlier releases. Routes using the removed components still need manual migration (camel-splunk-hec is
  producer-only and is not a drop-in replacement for camel-splunk).
recipeList:
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-digitalocean
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-iec60870
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-irc
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-ironmq
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-json-patch
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-leveldb
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-splunk
  - org.openrewrite.maven.RemoveDependency:
      groupId: org.apache.camel
      artifactId: camel-catalog-lucene
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-core-exchange-pooling-deprecated
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.removeExchangePoolingProperties
displayName: Remove the deprecated exchange pooling properties
description: >-
  Exchange pooling was deprecated in Camel 4.23 and the upgrade guide recommends removing the
  camel.main.exchange-factory property together with the related capacity and statistics properties. The keys are
  matched with relaxed binding, so the camelCase spellings are removed as well. Code using the deprecated
  Pooled* classes needs manual review.
recipeList:
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: camel.main.exchange-factory
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: camel.main.exchange-factory-capacity
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: camel.main.exchange-factory-statistics-enabled
  - org.openrewrite.yaml.DeleteProperty:
      propertyKey: camel.main.exchange-factory
  - org.openrewrite.yaml.DeleteProperty:
      propertyKey: camel.main.exchange-factory-capacity
  - org.openrewrite.yaml.DeleteProperty:
      propertyKey: camel.main.exchange-factory-statistics-enabled
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-pqc-bouncy-castle-186-breaking-change
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migratePqcParameterSpecs
displayName: Migrate the removed Bouncy Castle BCPQC parameter spec classes used with camel-pqc
description: >-
  Camel 4.23 moved to Bouncy Castle 1.86, which removed the legacy org.bouncycastle.pqc.jcajce.spec parameter
  spec classes. Changes them to the org.bouncycastle.jcajce.spec classes of the BC provider: CMCEParameterSpec,
  FrodoParameterSpec to FrodoKEMParameterSpec, KyberParameterSpec to MLKEMParameterSpec, DilithiumParameterSpec
  to MLDSAParameterSpec and SPHINCSPlusParameterSpec to SLHDSAParameterSpec. The static parameter-set fields of
  the new classes carry the standardized names (for example MLKEMParameterSpec.ml_kem_768 instead of
  KyberParameterSpec.kyber768), so field references still need a manual fix-up. PicnicParameterSpec,
  PQCSignatureAlgorithms.PICNIC and PQCDefaultPicnicMaterial have no replacement.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-pqc
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.CMCEParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.CMCEParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.FrodoParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.FrodoKEMParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.KyberParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.MLKEMParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.DilithiumParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.MLDSAParameterSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.bouncycastle.pqc.jcajce.spec.SPHINCSPlusParameterSpec
      newFullyQualifiedTypeName: org.bouncycastle.jcajce.spec.SLHDSAParameterSpec
