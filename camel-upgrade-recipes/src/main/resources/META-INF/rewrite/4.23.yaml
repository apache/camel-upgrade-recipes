## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_23.adoc#camel-joor
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel423.migrateJoorJavaApi
displayName: Migrate joor Java API to java
description: >-
  The joor language was removed in Camel 4.23; it was renamed to java in 4.3 and the old name is now gone.
  Renames the removed joor(...) builder methods to the equivalent java(...) overloads, and changes the removed
  JoorExpression, JoorLanguage and @Joor annotation types to JavaExpression, JavaLanguage and @Java. The joor and
  java languages declare identical options, so this is a one-to-one rename. A static import of Builder.joor is
  rewritten when it is used; one that is shadowed by the inherited BuilderSupport.joor inside a RouteBuilder was
  already unused and is left behind. BeanFactoryDefinition.joor(String) is deliberately left
  alone: unlike the builder methods it still exists in 4.23. The camel-joor dependency is also left in place,
  since the java language itself ships from that artifact.
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.Builder joor(String)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.Builder joor(String, Class)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.BuilderSupport joor(String)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.BuilderSupport joor(String, Class)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.ExpressionClause joor(String)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.ExpressionClause joor(String, Class)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.ExpressionClauseSupport joor(String)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.ExpressionClauseSupport joor(String, Class)
      newMethodName: java
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.apache.camel.builder.LanguageBuilderFactory joor()
      newMethodName: java
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.model.language.JoorExpression
      newFullyQualifiedTypeName: org.apache.camel.model.language.JavaExpression
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.language.joor.JoorLanguage
      newFullyQualifiedTypeName: org.apache.camel.language.joor.JavaLanguage
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.camel.language.joor.Joor
      newFullyQualifiedTypeName: org.apache.camel.language.joor.Java
---
